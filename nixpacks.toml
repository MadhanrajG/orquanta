[phases.setup]
nixPkgs = ["python311", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements_deploy.txt",
  "cd v4/frontend && npm ci"
]

[phases.build]
cmds = [
  "cd v4/frontend && VITE_API_BASE_URL=https://orquanta.com VITE_WS_BASE_URL=wss://orquanta.com VITE_APP_ENV=production npm run build"
]

[start]
cmd = "uvicorn v4.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --log-level info"
