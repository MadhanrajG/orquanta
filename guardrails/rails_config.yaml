# ============================================================
# OrQuanta NeMo-Style Guardrails Configuration
# ============================================================
# This file defines all policy rails enforced on autonomous
# agent actions. Inspired by NVIDIA NeMo Guardrails structure.
#
# Environment variable overrides are supported for all numeric
# values via ORQUANTA_RAILS_* prefix.
# ============================================================

version: "1.0"
platform: "OrQuanta Agentic v1.0"
updated: "2026-03-23"

# ─── Budget Rails ────────────────────────────────────────────
# Hard financial limits on autonomous agent spending.
budget_rails:
  # Auto-approve any single action below this cost (USD)
  auto_approve_threshold_usd: 100.0

  # Require human approval or emit critical log above this (USD)
  human_approval_threshold_usd: 500.0

  # Hard daily cap — reject any action that would exceed this
  daily_spend_cap_usd: 5000.0

  # Per-action cost sanity check (single action can't exceed this)
  single_action_max_usd: 1000.0

  # Hour-over-hour spend velocity limit (USD/hr)
  hourly_spend_velocity_limit_usd: 500.0

# ─── Action Rails ────────────────────────────────────────────
# Restrictions on specific dangerous actions.
action_rails:
  # Actions that are ALWAYS blocked (never autonomous)
  blocked_actions:
    - "delete_all_nodes"
    - "terminate_all_jobs"
    - "revoke_all_tokens"
    - "drop_database"
    - "wipe_storage"

  # Actions requiring minimum agent confidence score (0.0–1.0)
  confidence_requirements:
    scale_down: 0.80        # Must be 80%+ confident before scaling down
    migrate_job: 0.75       # 75%+ to migrate a running job
    terminate_job: 0.85     # 85%+ to terminate a job
    replace_node: 0.90      # 90%+ to replace an entire node

  # Maximum scale-down percentage in a single action (0–100)
  max_scale_down_pct: 50

  # Maximum jobs migrated in a single batch
  max_batch_migration: 10

# ─── Rate Rails ──────────────────────────────────────────────
# Per-agent action frequency limits.
rate_rails:
  # Default actions per minute per agent
  default_actions_per_minute: 30

  # Agent-specific overrides
  per_agent:
    scheduler_agent: 60       # High-frequency scheduling
    cost_optimizer_agent: 20  # Price checks less frequent
    healing_agent: 45         # Needs rapid response
    forecast_agent: 10        # Compute-heavy, less frequent
    master_orchestrator: 30

# ─── SLA Rails ───────────────────────────────────────────────
# Service Level Agreement policy enforcement.
sla_rails:
  # Minimum acceptable node health score (0.0–1.0)
  min_node_health_score: 0.70

  # Maximum job latency before healing triggers (seconds)
  max_job_latency_seconds: 300

  # Target GPU utilization range (%)
  target_gpu_utilization_min_pct: 75
  target_gpu_utilization_max_pct: 95

  # Maximum failure rate before escalation
  max_failure_rate_pct: 5.0

# ─── Output Rails ────────────────────────────────────────────
# Controls on what agent outputs are permitted.
output_rails:
  # Mask sensitive fields from agent reasoning logs
  sensitive_fields_to_mask:
    - "api_key"
    - "secret"
    - "password"
    - "token"
    - "credit_card"
    - "ssn"

  # Maximum reasoning log entry size (chars)
  max_reasoning_entry_chars: 2000

  # Emit warning if agent reasoning mentions these phrases
  flagged_phrases:
    - "bypass guardrail"
    - "ignore policy"
    - "override safety"
    - "disable monitoring"

# ─── Scope Rails ─────────────────────────────────────────────
# Which external services agents may call.
scope_rails:
  # Approved external provider APIs
  approved_external_endpoints:
    - "api.lambdalabs.com"
    - "api.runpod.io"
    - "console.vast.ai"
    - "api.openai.com"
    - "api.anthropic.com"
    - "integrate.api.nvidia.com"  # NIM
    - "api.stripe.com"

  # Cloud metadata services (internal only)
  approved_cloud_metadata:
    - "169.254.169.254"  # AWS/GCP instance metadata

  # Block agents from reading these file paths
  blocked_file_paths:
    - "*.env"
    - "*.pem"
    - "*.key"
    - "secrets/*"
    - ".ssh/*"
