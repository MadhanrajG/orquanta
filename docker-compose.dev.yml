# OrQuanta — Local development stack
# Starts Redis (caching/queues) and ChromaDB (vector memory) without needing cloud credentials.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml down
#
# Then start the API:
#   REDIS_URL=redis://localhost:6379 CHROMA_HOST=localhost CHROMA_PORT=8200 \
#   LLM_PROVIDER=mock JWT_SECRET_KEY=dev-secret-key-local \
#   python -m uvicorn v4.api.main:app --reload --port 8000

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: orquanta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: orquanta-chromadb
    ports:
      - "8200:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  chroma_data:
    driver: local
