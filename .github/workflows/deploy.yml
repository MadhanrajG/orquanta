name: OrQuanta CI/CD — $0 Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  GHCR_IMAGE: ghcr.io/madhanrajg/orquanta

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure (all free):
#   Cloudflare Worker  — edge routing, landing page
#   Cloudflare Pages   — React SPA (global CDN)
#   GHCR               — Docker image registry (free for public repos)
#   Oracle ARM64       — FastAPI backend (always-free, SSH deploy)
#   Neon PostgreSQL    — Database (free forever)
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─── 1. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements_deploy.txt pytest pytest-cov pytest-asyncio

      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-ci
          LLM_PROVIDER: mock
          USE_REAL_PROVIDERS: 'false'
          PYTHONPATH: .
        run: |
          python -m pytest v4/tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --cov=v4 \
            --cov-report=xml \
            -p no:warnings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─── 2. Security scan ──────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit safety

      - name: Bandit (HIGH severity only — fail build)
        run: bandit -r v4/ -x v4/tests --severity-level high -q

      - name: Safety (known CVEs)
        run: safety check -r requirements_deploy.txt --full-report || true

      - name: No hardcoded secrets
        run: |
          if grep -rn "sk-[a-zA-Z0-9]\{48\}" v4/ --include="*.py" | grep -v test; then
            echo "ERROR: Possible hardcoded OpenAI key"
            exit 1
          fi
          if grep -rn "AKIA[A-Z0-9]\{16\}" v4/ --include="*.py" | grep -v test; then
            echo "ERROR: Possible hardcoded AWS key"
            exit 1
          fi
          echo "No hardcoded secrets found."

  # ─── 3. Deploy Cloudflare Worker + Pages ──────────────────────────────────
  deploy-cloudflare:
    name: Deploy CF Worker + Pages
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://orquanta.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Write frontend .env.production
        run: |
          cat > v4/frontend/.env.production <<EOF
          VITE_API_BASE_URL=https://orquanta.com
          VITE_WS_BASE_URL=wss://orquanta.com
          VITE_APP_ENV=production
          EOF

      - name: Build React SPA
        working-directory: v4/frontend
        run: |
          npm ci
          npm run build -- --mode production

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2dd90fe6473410b2605b5b177d606599"
        run: wrangler deploy --config wrangler.toml

      - name: Deploy SPA to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2dd90fe6473410b2605b5b177d606599"
        run: |
          wrangler pages deploy v4/frontend/dist \
            --project-name orquanta-app \
            --branch main \
            --commit-message "deploy: ${{ github.sha }}"

  # ─── 4. Build & push Docker image to GHCR (free) ─────────────────────────
  build-image:
    name: Build Docker Image → GHCR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 5. Deploy to Oracle ARM64 (SSH) ──────────────────────────────────────
  deploy-oracle:
    name: Deploy to Oracle ARM64
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && vars.ORACLE_HOST != ''
    environment:
      name: production
      url: https://orquanta.com
    steps:
      - name: SSH deploy to Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "==> Pulling latest image from GHCR..."
            sudo docker pull ghcr.io/madhanrajg/orquanta:latest

            echo "==> Restarting orquanta-api container..."
            sudo docker stop orquanta-api 2>/dev/null || true
            sudo docker rm   orquanta-api 2>/dev/null || true

            sudo docker run -d \
              --name orquanta-api \
              --network orquanta \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              --env-file /etc/orquanta/env \
              ghcr.io/madhanrajg/orquanta:latest

            echo "==> Waiting for health check..."
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Healthy (HTTP 200)"
                exit 0
              fi
              echo "Attempt $i/18 — HTTP $STATUS — waiting 5s..."
              sleep 5
            done
            echo "ERROR: API not healthy after 90s"
            sudo docker logs orquanta-api --tail 50
            exit 1

      - name: Smoke test via orquanta.com
        run: |
          sleep 10
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://orquanta.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "orquanta.com/health → HTTP 200"
              exit 0
            fi
            echo "Attempt $i/6 — HTTP $STATUS — waiting 5s..."
            sleep 5
          done
          echo "Smoke test inconclusive — tunnel may still be warming"
          exit 0
