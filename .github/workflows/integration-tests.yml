name: OrQuanta Integration Tests — PostgreSQL 16 + Redis 7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions
permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '16'
  REDIS_VERSION: '7'
  POSTGRES_TEST_URL: postgresql://orquanta:orquanta-dev-change-me@localhost:5432/orquanta_test
  REDIS_TEST_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: test-secret-key-ci-32-characters-minimum
  LLM_PROVIDER: mock
  USE_REAL_PROVIDERS: 'false'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ─── 1. Local Regression Suite (198 non-integration tests) ──────────────────────
  local-regression:
    name: Local Regression (198 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            v4/requirements.txt
            requirements.txt
            requirements_deploy.txt

      - name: Install dependencies
        run: |
          pip install -r v4/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run local regression tests
        working-directory: ${{ github.workspace }}/v4
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --junitxml=../test-results-local.xml \
            --cov=. \
            --cov-report=xml:../coverage-local.xml \
            -p no:warnings \
            --ignore=tests/test_postgresql_integration.py \
            --ignore=tests/test_redis_celery_integration.py \
            --maxfail=0 \
            -o junit_family=xunit2

      - name: Upload local test results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: local-regression-results
          path: |
            test-results-local.xml
            coverage-local.xml
          retention-days: 7

  # ─── 2. PostgreSQL 16 Integration Tests (9 tests) ────────────────────────────────
  postgresql-integration:
    name: PostgreSQL 16 Integration (9 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: orquanta_test
          POSTGRES_USER: orquanta
          POSTGRES_PASSWORD: orquanta-dev-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orquanta -d orquanta_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            v4/requirements.txt
            requirements.txt
            requirements_deploy.txt

      - name: Install dependencies
        run: |
          pip install -r v4/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U orquanta -d orquanta_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Copy and patch alembic.ini for migration access
        run: |
          cp ${{ github.workspace }}/alembic.ini ${{ github.workspace }}/v4/alembic.ini
          sed -i 's|script_location = v4/alembic|script_location = alembic|' ${{ github.workspace }}/v4/alembic.ini

      - name: Run PostgreSQL integration tests
        working-directory: ${{ github.workspace }}/v4
        env:
          POSTGRES_TEST_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          python -m pytest tests/test_postgresql_integration.py \
            -v \
            --tb=long \
            --junitxml=../test-results-pg.xml \
            --cov=. \
            --cov-report=xml:../coverage-pg.xml \
            -p no:warnings \
            --maxfail=0 \
            -o junit_family=xunit2

      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: postgresql-integration-results
          path: |
            test-results-pg.xml
            coverage-pg.xml
          retention-days: 7

  # ─── 3. Redis 7 + Celery Integration Tests (13 tests) ───────────────────────────
  redis-celery-integration:
    name: Redis 7 + Celery Integration (13 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            v4/requirements.txt
            requirements.txt
            requirements_deploy.txt

      - name: Install dependencies
        run: |
          pip install -r v4/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Install Redis CLI tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping >/dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis did not become ready in time"
          exit 1

      - name: Copy and patch alembic.ini for migration access
        run: |
          cp ${{ github.workspace }}/alembic.ini ${{ github.workspace }}/v4/alembic.ini
          sed -i 's|script_location = v4/alembic|script_location = alembic|' ${{ github.workspace }}/v4/alembic.ini

      - name: Run Redis/Celery integration tests
        working-directory: ${{ github.workspace }}/v4
        env:
          REDIS_TEST_URL: ${{ env.REDIS_TEST_URL }}
        run: |
          python -m pytest tests/test_redis_celery_integration.py \
            -v \
            --tb=long \
            --junitxml=../test-results-redis.xml \
            --cov=. \
            --cov-report=xml:../coverage-redis.xml \
            -p no:warnings \
            --maxfail=0 \
            -o junit_family=xunit2

      - name: Upload Redis/Celery test results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: redis-celery-integration-results
          path: |
            test-results-redis.xml
            coverage-redis.xml
          retention-days: 7

  # ─── 4. Cross-Service Integration (PostgreSQL + Redis together) ──────────────────
  # Retained: validates Celery worker + PostgreSQL job persistence together.
  # The individual integration tests run against single services; this suite
  # exercises scenarios where both DB and broker are used simultaneously
  # (e.g., task submission → DB persistence → worker execution → DB update).
  cross-service-integration:
    name: Cross-Service Integration (PG + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: orquanta_test
          POSTGRES_USER: orquanta
          POSTGRES_PASSWORD: orquanta-dev-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orquanta -d orquanta_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            v4/requirements.txt
            requirements.txt
            requirements_deploy.txt

      - name: Install dependencies
        run: |
          pip install -r v4/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Install PostgreSQL and Redis client tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U orquanta -d orquanta_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping >/dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis did not become ready in time"
          exit 1

      - name: Copy and patch alembic.ini for migration access
        run: |
          cp ${{ github.workspace }}/alembic.ini ${{ github.workspace }}/v4/alembic.ini
          sed -i 's|script_location = v4/alembic|script_location = alembic|' ${{ github.workspace }}/v4/alembic.ini

      - name: Run cross-service integration tests
        working-directory: ${{ github.workspace }}/v4
        env:
          POSTGRES_TEST_URL: ${{ env.POSTGRES_TEST_URL }}
          REDIS_TEST_URL: ${{ env.REDIS_TEST_URL }}
        run: |
          # Run both integration test suites together to validate cross-service behavior
          python -m pytest tests/test_postgresql_integration.py tests/test_redis_celery_integration.py \
            -v \
            --tb=long \
            --junitxml=../test-results-cross-service.xml \
            --cov=. \
            --cov-report=xml:../coverage-cross-service.xml \
            -p no:warnings \
            --maxfail=0 \
            -o junit_family=xunit2

      - name: Upload cross-service test results
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: cross-service-integration-results
          path: |
            test-results-cross-service.xml
            coverage-cross-service.xml
          retention-days: 7

  # ─── 5. Security: No Secrets in Logs ────────────────────────────────────────────
  security-secrets-check:
    name: Security — No Secrets in Logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Scan for hardcoded secrets in test files
        id: secrets-scan
        run: |
          # Secret scanner for CI — limited coverage, NOT a Gitleaks replacement.
          # Detects six hardcoded secret categories only (OpenAI, AWS, GitHub PAT,
          # GitHub secret, production PostgreSQL URL, production Redis URL). No entropy
          # analysis, no key files, no generic detectors, no history scanning.
          # Output format: FILE | CATEGORY | COUNT (no secret values printed).
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          CATEGORIES = (
              ("OPENAI_KEY", r"sk-[A-Za-z0-9]{48,}"),
              ("AWS_KEY", r"AKIA[A-Z0-9]{16}"),
              ("GITHUB_TOKEN", r"ghp_[A-Za-z0-9]{36}"),
              ("GITHUB_SECRET", r"ghs_[A-Za-z0-9]{36}"),
              ("PROD_POSTGRES_URL", r"postgresql://[^@\s]+:[^@\s]+@[^\s/?#]+"),
              ("PROD_REDIS_URL", r"redis://[^@\s]+:[^@\s]+@[^\s/?#]+"),
          )
          LOCALHOST_HOSTNAMES = {"localhost", "127.0.0.1", "::1", "0.0.0.0"}
          TEST_DIR = Path("v4/tests")


          def _hostname_of(match_text):
              """Return lower-cased hostname from a URL match.

              Handles bracketed IPv6 literals (e.g. [::1], [2001:db8::1]).
              Returns None for malformed URLs -- never silently localhost.
              """
              try:
                  host = urlparse(match_text).hostname
                  if host is not None:
                      return host.lower()
              except Exception:
                  pass
              m = re.search(r"@\[([^\]]+)\]", match_text)
              if m:
                  return m.group(1).lower()
              return None


          class ScannerError(Exception):
              pass


          def scan_file(path):
              """Scan one Python file. Return [(category, count), ...].
              Raise ScannerError on read or scanner error."""
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError as exc:
                  raise ScannerError("failed to read {}: {}".format(path, exc)) from exc
              findings = []
              for category, pattern in CATEGORIES:
                  try:
                      regex = re.compile(pattern)
                  except re.error as exc:
                      raise ScannerError("invalid regex for {}: {}".format(category, exc)) from exc
                  count = 0
                  for match in regex.finditer(text):
                      if category in ("PROD_POSTGRES_URL", "PROD_REDIS_URL"):
                          hostname = _hostname_of(match.group(0)) or ""
                          if hostname in LOCALHOST_HOSTNAMES:
                              continue
                      count += 1
                  if count:
                      findings.append((category, count))
              return findings


          def main():
              try:
                  root = Path(TEST_DIR)
                  if not root.is_dir():
                      raise ScannerError("test directory not found: {}".format(root))
                  files = sorted(p for p in root.rglob("*.py") if p.is_file())
                  total = 0
                  for path in files:
                      try:
                          rel = path.relative_to(Path.cwd())
                      except ValueError:
                          rel = path
                      try:
                          found = scan_file(path)
                      except ScannerError as exc:
                          print("::error::{}".format(exc), file=sys.stderr)
                          return 2
                      for category, count in found:
                          print("{} | {} | {}".format(rel, category, count))
                          total += count
                  if total:
                      print("::error::Hardcoded secrets detected in test files ({} findings)".format(total), file=sys.stderr)
                      return 1
                  print("No hardcoded secrets found in test files.")
                  return 0
              except ScannerError as exc:
                  print("::error::{}".format(exc), file=sys.stderr)
                  return 2


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Create artifact for summary job
        if: always()
        run: |
          echo "security-secrets-check completed" > security-secrets-check.txt
          if [ "${{ steps.secrets-scan.outcome }}" = "failure" ]; then
            echo "RESULT: FAILED - Secrets detected" >> security-secrets-check.txt
          else
            echo "RESULT: PASSED - No secrets found" >> security-secrets-check.txt
          fi

      - name: Upload security check artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: always()
        with:
          name: security-secrets-check-results
          path: security-secrets-check.txt
          retention-days: 7

  # ─── 6. Summary ──────────────────────────────────────────────────────────────────
  summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs:
      - local-regression
      - postgresql-integration
      - redis-celery-integration
      - cross-service-integration
      - security-secrets-check
    if: always()
    timeout-minutes: 10
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: artifacts

      - name: Print test summary
        run: |
          echo "=== ORQUANTA INTEGRATION TEST SUMMARY ==="
          echo ""

          # Local Regression
          echo "Local Regression (SQLite):"
          if [ -f artifacts/local-regression-results/test-results-local.xml ]; then
            grep -E 'tests?=' artifacts/local-regression-results/test-results-local.xml | tail -1 || echo "  Results file exists"
          else
            echo "  SKIPPED/MISSING"
          fi
          echo ""

          # PostgreSQL Integration
          echo "PostgreSQL 16 Integration:"
          if [ -f artifacts/postgresql-integration-results/test-results-pg.xml ]; then
            grep -E 'tests?=' artifacts/postgresql-integration-results/test-results-pg.xml | tail -1 || echo "  Results file exists"
          else
            echo "  SKIPPED/MISSING"
          fi
          echo ""

          # Redis/Celery Integration
          echo "Redis 7 + Celery Integration:"
          if [ -f artifacts/redis-celery-integration-results/test-results-redis.xml ]; then
            grep -E 'tests?=' artifacts/redis-celery-integration-results/test-results-redis.xml | tail -1 || echo "  Results file exists"
          else
            echo "  SKIPPED/MISSING"
          fi
          echo ""

          # Cross-Service Integration
          echo "Cross-Service Integration (PG + Redis):"
          if [ -f artifacts/cross-service-integration-results/test-results-cross-service.xml ]; then
            grep -E 'tests?=' artifacts/cross-service-integration-results/test-results-cross-service.xml | tail -1 || echo "  Results file exists"
          else
            echo "  SKIPPED/MISSING"
          fi
          echo ""

          # Security
          echo "Security — No Secrets:"
          if [ -f artifacts/security-secrets-check-results/security-secrets-check.txt ]; then
            cat artifacts/security-secrets-check-results/security-secrets-check.txt
          else
            echo "  CHECK JOB OUTPUT"
          fi
          echo ""
          echo "=== END SUMMARY ==="

      - name: Fail if any REQUIRED test suite failed
        if: |
          needs.local-regression.result != 'success' ||
          needs.postgresql-integration.result != 'success' ||
          needs.redis-celery-integration.result != 'success' ||
          needs.cross-service-integration.result != 'success' ||
          needs.security-secrets-check.result != 'success'
        run: |
          echo "::error::One or more REQUIRED integration test suites failed"
          exit 1
