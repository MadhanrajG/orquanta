user nginx;
worker_processes auto;          # auto = 1 per vCPU (4 on A1.Flex)
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;    # 4 workers × 2048 = 8192 concurrent connections
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=16k flush=30s;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;            # hide Nginx version

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Global per-IP limit — prevents DDoS at the proxy level
    limit_req_zone $binary_remote_addr zone=global:20m rate=60r/m;
    # Tighter limit for auth endpoints specifically
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_status 429;

    # ── Upstream: OrQuanta FastAPI ─────────────────────────────────────────────
    upstream orquanta_api {
        server api:8000;
        keepalive 32;
    }

    # ── Upstream: Grafana ──────────────────────────────────────────────────────
    upstream grafana {
        server grafana:3000;
        keepalive 8;
    }

    # Include individual server blocks
    include /etc/nginx/conf.d/*.conf;
}
