services:
  - type: web
    name: orquanta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore  # Closest to India
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: auto
      - key: TURBOQUANT_ENABLED
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: orquanta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false   # You enter this manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false   # You enter this manually in Render dashboard

databases:
  - name: orquanta-db
    plan: free
    region: singapore
    databaseName: orquanta
    user: orquanta
