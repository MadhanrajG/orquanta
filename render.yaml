services:
  - type: web
    name: orquanta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: auto
      - key: TURBOQUANT_ENABLED
        value: false
      - key: APP_URL
        value: https://orquanta.com
      - key: CORS_ORIGINS
        value: https://orquanta.com,https://www.orquanta.com
      - key: ADMIN_EMAIL
        value: admin@orquanta.com
      - key: DATABASE_URL
        fromDatabase:
          name: orquanta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # Set manually in Render dashboard
      - key: AUDIT_HMAC_KEY
        sync: false   # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false   # Optional — enables real LLM reasoning
      - key: ANTHROPIC_API_KEY
        sync: false   # Optional — enables Claude reasoning

databases:
  - name: orquanta-db
    plan: free
    region: singapore
    databaseName: orquanta
    user: orquanta
