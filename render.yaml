services:
  - type: web
    name: orquanta
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 'starter' ($7/mo) keeps service always-on (no 15-min sleep).
    # Use 'free' for initial smoke-test, upgrade before sharing with testers.
    plan: starter
    region: singapore
    healthCheckPath: /health
    # Docker build args — bake production URLs into the React bundle at build time
    dockerBuildArgs:
      - key: VITE_API_BASE_URL
        value: https://orquanta.com
      - key: VITE_WS_BASE_URL
        value: wss://orquanta.com
      - key: VITE_APP_ENV
        value: production
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: ORQUANTA_DEMO_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      - key: USE_REAL_PROVIDERS
        value: "false"
      - key: TURBOQUANT_ENABLED
        value: "false"
      - key: APP_URL
        value: https://orquanta.com
      - key: CORS_ORIGINS
        value: https://orquanta.com,https://www.orquanta.com
      - key: ADMIN_EMAIL
        value: admin@orquanta.ai
      - key: DATABASE_URL
        fromDatabase:
          name: orquanta-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false   # Optional – enables real LLM reasoning
      - key: ANTHROPIC_API_KEY
        sync: false   # Optional – enables Claude reasoning
      - key: SENTRY_DSN
        sync: false   # Optional – error tracking

databases:
  - name: orquanta-db
    plan: free
    region: singapore
    databaseName: orquanta
    user: orquanta
